study:
  id: dkfz
  polarity: negative
  instrument: Orbitrap
dataset_profile: cohort_with_qc
files:
  sample_metadata: dkfz_sample_metadata.csv
system_suitability:
  ppm_tolerance: 5
feature_detection:
  mass_error_ppm: 5
  peak_width:
  - 10
  - 60
  max_gaps: 2
  min_scans: 2
  noise_threshold: 8000
feature_alignment:
  alignment_mz_tolerance_ppm: 5
  alignment_rt_tolerance_sec: 5
blank_qc:
  mz_tolerance_ppm: 5
  rt_tolerance_sec: 5
adduct_annotation:
  primary_adduct: '[M-H]-'
  ppm_tolerance: 5
  candidate_adducts:
  - '[M-H]-'
  - '[M+Cl]-'
  - '[M+FA-H]-'
  - '[2M-H]-'
  - '[M+Na-2H]-'
spectral_purity:
  isolation_window_da: 1
  min_purity: 0.7
library_matching:
  reference_library: "EMBL-MCF"
  reference_library_source: "curatr.mcf.embl.de/MS2/export"
  reference_library_path: 'reference_libraries/EMBL-MCF_negative.msp'
  reference_library_format: "msp"
  similarity_metric: "cosine"
  precursor_mz_tolerance_ppm: 10
  fragment_mz_tolerance_da: 0.02
  min_match_score: 0.7
  validate_against_known_identity: true
config_version: v0.1
