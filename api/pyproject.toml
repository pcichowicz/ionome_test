[project]
name = "ionome-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ionome-core",
    "ionome-analysis",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "aiosqlite",
    "python-dotenv",
    "pandas",
    "pyyaml",
    "jinja2",
    "python-multipart",
]

[tool.uv.sources]
ionome-core = { workspace = true }
ionome-analysis = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
