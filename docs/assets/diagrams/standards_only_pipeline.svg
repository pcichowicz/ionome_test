<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Standards-only pipeline</title>
<desc>Twelve-stage sequential pipeline: ingestion, scan summary cache, chromatogram plotting, system suitability, feature detection, blank QC, adduct annotation, spectral purity, library matching, library assembly, summary stats plotting, export.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #2c2c2a; }
  .box { fill: #f1efe8; stroke: #888780; stroke-width: 0.5; }
  .lbl { font-size: 12px; }
</style>

<rect class="box" x="40" y="60" width="186" height="36" rx="6"/><text class="lbl" x="133" y="78" text-anchor="middle" dominant-baseline="central">ingestion</text>
<rect class="box" x="246" y="60" width="186" height="36" rx="6"/><text class="lbl" x="339" y="78" text-anchor="middle" dominant-baseline="central">scan_summary_cache</text>
<rect class="box" x="452" y="60" width="186" height="36" rx="6"/><text class="lbl" x="545" y="78" text-anchor="middle" dominant-baseline="central">chromatogram_plotting</text>

<line x1="226" y1="78" x2="246" y2="78" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="432" y1="78" x2="452" y2="78" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="545" y1="96" x2="545" y2="146" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="box" x="452" y="146" width="186" height="36" rx="6"/><text class="lbl" x="545" y="164" text-anchor="middle" dominant-baseline="central">system_suitability</text>
<rect class="box" x="246" y="146" width="186" height="36" rx="6"/><text class="lbl" x="339" y="164" text-anchor="middle" dominant-baseline="central">feature_detection</text>
<rect class="box" x="40" y="146" width="186" height="36" rx="6"/><text class="lbl" x="133" y="164" text-anchor="middle" dominant-baseline="central">blank_qc</text>

<line x1="452" y1="164" x2="432" y2="164" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="246" y1="164" x2="226" y2="164" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="133" y1="182" x2="133" y2="232" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="232" width="186" height="36" rx="6"/><text class="lbl" x="133" y="250" text-anchor="middle" dominant-baseline="central">adduct_annotation</text>
<rect class="box" x="246" y="232" width="186" height="36" rx="6"/><text class="lbl" x="339" y="250" text-anchor="middle" dominant-baseline="central">spectral_purity</text>
<rect class="box" x="452" y="232" width="186" height="36" rx="6"/><text class="lbl" x="545" y="250" text-anchor="middle" dominant-baseline="central">library_matching</text>

<line x1="226" y1="250" x2="246" y2="250" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="432" y1="250" x2="452" y2="250" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="545" y1="268" x2="545" y2="318" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="box" x="452" y="318" width="186" height="36" rx="6"/><text class="lbl" x="545" y="336" text-anchor="middle" dominant-baseline="central">library_assembly</text>
<rect class="box" x="246" y="318" width="186" height="36" rx="6"/><text class="lbl" x="339" y="336" text-anchor="middle" dominant-baseline="central">summary_stats_plotting</text>
<rect class="box" x="40" y="318" width="186" height="36" rx="6"/><text class="lbl" x="133" y="336" text-anchor="middle" dominant-baseline="central">export</text>

<line x1="452" y1="336" x2="432" y2="336" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="246" y1="336" x2="226" y2="336" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
