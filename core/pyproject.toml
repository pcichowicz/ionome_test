[project]
name = "ionome-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "aiosqlite",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "pandas",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
